                <label>

                    <input id="playersCount" type="number" min="0" value="0" onchange="updatePrizePool()" />

                <label>

  <script>
    const levels = [
        { small: 25, big: 50},
        { small: 50, big: 100},
        { small: 100, big: 200},
        { small: 100, big: 300},
        { small: 200, big: 400},
        { small: 200, big: 500},
        { small: 300, big: 600},
        { small: 400, big: 800},
        { small: 600, big: 1200},
        { small: 800, big: 1600},
        { small: 1000, big: 2000},
        { small: 1500, big: 3000},
        { small: 2000, big: 4000},
        { small: 3000, big: 6000},
        { small: 4000, big: 8000},
        { small: 5000, big: 10000},
        { small: 6000, big: 12000},
        { small: 8000, big: 16000},
        { small: 10000, big: 20000},
        { small: 15000, big: 30000},
        { small: 20000, big: 40000},
        { small: 30000, big: 60000},
        { small: 40000, big: 80000},
        { small: 50000, big: 100000},
    ];

    let currentLevel = 0;
    let levelDuration = 10 * 60;
    let remainingSeconds = levelDuration;
    let interval = null;
    let totalInterval = null;
    let addonLevel = 5;
    let totalSeconds = 0;

    let breakInterval = null;
    let breakSeconds = 0;
    let isBreak = false;
    let showPayouts = false;
    let currentPayouts = [];

    let playersList = [];

    const tournamentName = document.getElementById('tournamentName');

    const levelNumber = document.getElementById('levelNumber');
    const timer = document.getElementById('timer');
    const smallBlind = document.getElementById('smallBlind');
    const bigBlind = document.getElementById('bigBlind');
    const ante = document.getElementById('ante');
    const status = document.getElementById('status');
    const levelsList = document.getElementById('levelsList');
    const levelMinutes = document.getElementById('levelMinutes');
    const structurePanel = document.getElementById('structurePanel');
    const totalTimer = document.getElementById('totalTimer');
    const breakMinutes = document.getElementById('breakMinutes');

    const buyinValue = document.getElementById('buyinValue');
    const playersCount = document.getElementById('playersCount');
    const rebuysCount = document.getElementById('rebuysCount');
    const addonsCount = document.getElementById('addonsCount');
    const addonValue = document.getElementById('addonValue');
    const houseFee = document.getElementById('houseFee');
    const prizePool = document.getElementById('prizePool');
    const remainingPlayers = document.getElementById('remainingPlayers');
    const totalCollected = document.getElementById('totalCollected');
    const houseValue = document.getElementById('houseValue');
    //Jogadores
    const playerModal = document.getElementById('playerModal');
    const playerName = document.getElementById('playerName');
    const playerBuyin = document.getElementById('playerBuyin');
    const playerJackpot = document.getElementById('playerJackpot');
    const playersListBox = document.getElementById('playersListBox');

    const timerTitle = document.getElementById('timerTitle');
    // pagamentos
    const payoutTable = document.getElementById('payoutTable');
    function renderPayouts(payouts) {
        payoutTable.innerHTML = payouts.map(p => `
            <div>
            ${p.position}º → ${p.percent}% (${p.value.toLocaleString('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            })})
            </div>
        `).join('');
    }
    function openPlayerModal() {
      playerModal.style.display = 'flex';
      playerName.value = '';
      playerBuyin.value = buyinValue.value || 0;
      playerJackpot.value = 0;
      playerName.focus();
    }

    function closePlayerModal() {
      playerModal.style.display = 'none';
    }

    function addPlayer() {
      const name = playerName.value.trim();
      const buyin = Number(playerBuyin.value) || 0;
      const jackpot = Number(playerJackpot.value) || 0;

      if (!name) {
        alert('Digite o nome do jogador');
        return;
      }

      playersList.push({
        name,
        buyin,
        jackpot,
        rebuys: 0,
        addons: 0,
        status: 'ativo'
      });

      playersCount.value = playersList.length;
      remainingPlayers.value = playersList.filter(p => p.status === 'ativo').length;

      const currentBuyinTotal = Number(buyinValue.value) || 0;
      buyinValue.value = currentBuyinTotal || buyin;

      updatePrizePool();
      render();
      closePlayerModal();
      renderPlayersList();
    }
    function addRebuy(index) {
      playersList[index].rebuys += 1;

      rebuysCount.value = Number(rebuysCount.value || 0) + 1;

      updatePrizePool();
      renderPlayersList();
      saveState();
    }

    function addAddon(index) {
      playersList[index].addons += 1;

      addonsCount.value = Number(addonsCount.value || 0) + 1;

      updatePrizePool();
      renderPlayersList();
      saveState();
    }
    function renderPlayersList() {
      playersListBox.innerHTML = playersList.map((player, index) => `
        <div class="player-row ${player.status === 'eliminado' ? 'player-eliminated' : ''}">
          <strong>${player.name}</strong>

          <span>Buy-in: R$ ${player.buyin}</span>

          <span>Jackpot: R$ ${player.jackpot}</span>

          <div class="player-counter">
            <label>Rebuys</label>
            <div class="counter">
              <button onclick="changeRebuy(${index}, -1)">−</button>
              <span>${player.rebuys}</span>
              <button onclick="changeRebuy(${index}, 1)">+</button>
            </div>
          </div>

          <div class="player-counter">
            <label>Add-ons</label>
            <div class="counter">
              <button onclick="changeAddon(${index}, -1)">−</button>
              <span>${player.addons}</span>
              <button onclick="changeAddon(${index}, 1)">+</button>
            </div>
          </div>

          <button class="eliminate-btn" onclick="toggleEliminatePlayer(${index})">
            ${player.status === 'eliminado' ? 'Reativar' : 'Eliminar'}
          </button>
        </div>
      `).join('');
    }
    function toggleEliminatePlayer(index) {
      playersList[index].status =
        playersList[index].status === 'eliminado' ? 'ativo' : 'eliminado';

      remainingPlayers.value = playersList.filter(
        player => player.status !== 'eliminado'
      ).length;

      renderPlayersList();
      updatePrizePool();
      saveState();
    }
    function changeRebuy(index, value) {
      if (playersList[index].rebuys + value < 0) return;

      playersList[index].rebuys += value;

      rebuysCount.value = playersList.reduce(
        (total, player) => total + player.rebuys,
        0
      );

      updatePrizePool();
      renderPlayersList();
      saveState();
    }
    function changeAddon(index, value) {
      if (playersList[index].addons + value < 0) return;

      playersList[index].addons += value;

      addonsCount.value = playersList.reduce(
        (total, player) => total + player.addons,
        0
      );

      updatePrizePool();
      renderPlayersList();
      saveState();
    }
    function togglePayoutDisplay() {
        showPayouts = !showPayouts;
        saveState();
    }

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60).toString().padStart(2, '0');
      const secs = (seconds % 60).toString().padStart(2, '0');
      return `${minutes}:${secs}`;
    }
    function updateAddonLevel() {
        addonLevel = Number(document.getElementById('addonLevel').value) || 1;
        render();
    }
    function hideStructure() {
        structurePanel.style.display = 'none';
        document.querySelector('.main-grid').style.gridTemplateColumns = '1fr';
    }
    function showStructure() {
        structurePanel.style.display = 'block';
        document.querySelector('.main-grid').style.gridTemplateColumns = '1.35fr 0.65fr';
    }
    function formatTotalTime(seconds) {
        const hours = Math.floor(seconds / 3600).toString().padStart(2, '0');
        const minutes = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
        const secs = (seconds % 60).toString().padStart(2, '0');

        return `${hours}:${minutes}:${secs}`;
    }
    function startBreak() {
        if (isBreak) return;

        isBreak = true;
        pauseTimer();

        breakSeconds = (Number(breakMinutes.value) || 5) * 60;

        hideStructure();
        timerTitle.textContent = 'INTERVALO';

        status.textContent = 'INTERVALO';
        status.style.background = 'linear-gradient(135deg, #0ea5e9, #0369a1)';

        breakInterval = setInterval(() => {
            if (breakSeconds > 0) {
            breakSeconds--;
            timer.textContent = formatTime(breakSeconds);
            saveState();
            } else {
            endBreak();
            }
        }, 1000);
    }
    function endBreak() {
        clearInterval(breakInterval);
        breakInterval = null;
        breakSeconds = 0;
        isBreak = false;

        timerTitle.textContent = '';
        status.textContent = 'PAUSADO';
        status.style.background = 'linear-gradient(135deg, #dc2626, #991b1b)';

        render();
    }
    
    function updatePrizePool() {
        const buyin = Number(buyinValue.value) || 0;
        const addonPrice = Number(addonValue.value) || 0;
        const players = Number(playersCount.value) || 0;
        const rebuys = Number(rebuysCount.value) || 0;
        const addons = Number(addonsCount.value) || 0;
        const fee = Number(houseFee.value) || 0;

        const total = ((players + rebuys) * buyin) + (addons * addonPrice);
        const taxaCasa = total * (fee / 100);
        const premio = total - taxaCasa;
        currentPayouts = calculatePayouts(premio, players);

        totalCollected.textContent = total.toLocaleString('pt-BR', {
            style: 'currency',
            currency: 'BRL'
        });
        houseValue.textContent = taxaCasa.toLocaleString('pt-BR', {
            style: 'currency',
            currency: 'BRL'
        });
        prizePool.textContent = premio.toLocaleString('pt-BR', {
            style: 'currency',
            currency: 'BRL'
        });
        renderPayouts(currentPayouts);
        saveState();
    }
    async function saveState() {
      const state = {
        tournamentName: tournamentName.value || 'Torneio de Poker',
        currentLevel,
        remainingSeconds,
        totalSeconds,
        levels,
        addonLevel,
        isBreak,
        breakSeconds,
        status: status.textContent,
        showPayouts,
        payouts: currentPayouts || [],
        playersList,

        playersCount: Number(playersCount.value) || 0,
        remainingPlayers: Number(remainingPlayers.value) || Number(playersCount.value) || 0,
        prizePool: prizePool.textContent
      };

      const { error } = await supabaseClient
        .from('tournament_state')
        .update({ data: state })
        .eq('id', 1);

      if (error) {
        console.error('Erro ao salvar no Supabase:', error);
      }
    }

    function calculatePayouts(totalPrize, players) {
        const itm = Math.ceil(players * 0.15);

        let structure = [];

        if (itm <= 3) {
            structure = [50, 30, 20];
        } else if (itm <= 5) {
            structure = [35, 25, 18, 12, 10];
        } else if (itm <= 9) {
            structure = [28, 20, 14, 10, 8, 6, 5, 4, 3];
        } else {
            // distribuição mais flat (top 10+)
            let base = 100;
            for (let i = 0; i < itm; i++) {
            const value = Math.max(1, base - i * 2);
            structure.push(value);
            }

            // normaliza para 100%
            const sum = structure.reduce((a, b) => a + b, 0);
            structure = structure.map(v => (v / sum) * 100);
        }

        return structure.map((percent, index) => ({
            position: index + 1,
            value: (percent / 100) * totalPrize,
            percent: percent.toFixed(2)
        }));
        }

    function render() {
        const level = levels[currentLevel];
        levelNumber.textContent = currentLevel + 1;
        timer.textContent = formatTime(remainingSeconds);
        smallBlind.textContent = level.small;
        bigBlind.textContent = level.big;
        ante.textContent = level.big;
        editSmallBlind.value = level.small;
        editBigBlind.value = level.big;
        
        totalTimer.textContent = formatTotalTime(totalSeconds);

        updatePrizePool();

        levelsList.innerHTML = levels.map((item, index) => {
            const isAddon = index + 1 === addonLevel;

            return `
                <div class="next-level ${index === currentLevel ? 'current' : ''}">
                <span>
                Nível ${index + 1}
                ${isAddon ? '<strong style="color:#22c55e;"> ADD-ON</strong>' : ''}
                </span>
                <span>${item.small}/${item.big}</span>
                </div>
            `;
        }).join('');
        saveState();
    }

    function startTimer() {
        if (isBreak) {
            endBreak();
        }

        if (interval) return;

        hideStructure();
        timerTitle.textContent = '';

        if (!totalInterval) {
            totalInterval = setInterval(() => {
            totalSeconds++;
            totalTimer.textContent = formatTotalTime(totalSeconds);
            saveState();
            }, 1000);
        }

        interval = setInterval(() => {
            if (remainingSeconds > 0) {
            remainingSeconds--;
            } else {
            nextLevel();
            }

            render();
        }, 1000);

        status.textContent = 'RODANDO';
        status.style.background = 'linear-gradient(135deg, #16a34a, #15803d)';
        saveState();
    }
    
    function pauseTimer() {
      clearInterval(interval);
      interval = null;
      status.textContent = 'PAUSADO';
      status.style.background = 'linear-gradient(135deg, #dc2626, #991b1b)';
    }

    function nextLevel() {
      if (currentLevel < levels.length - 1) {
        currentLevel++;
        remainingSeconds = levelDuration;
        render();
      } else {
        pauseTimer();
        status.textContent = 'TORNEIO FINALIZADO';
      }
    }

    function previousLevel() {
      if (currentLevel > 0) {
        currentLevel--;
        remainingSeconds = levelDuration;
        render();
      }
    }

    function resetLevel() {
      remainingSeconds = levelDuration;
      render();
    }

    function resetTournament() {
        clearInterval(breakInterval);
        breakInterval = null;
        breakSeconds = 0;
        isBreak = false;
        timerTitle.textContent = '';

        clearInterval(totalInterval);
        totalInterval = null;
        totalSeconds = 0;

        pauseTimer();
        currentLevel = 0;
        remainingSeconds = levelDuration;
        buyinValue.value = 0;
        addonValue.value = 0;
        playersCount.value = 0;
        rebuysCount.value = 0;
        addonsCount.value = 0;

        updatePrizePool();

        render();
    }

    function updateLevelTime() {
      const minutes = Number(levelMinutes.value) || 10;
      levelDuration = minutes * 60;
      remainingSeconds = levelDuration;
      render();
    }
    const editSmallBlind = document.getElementById('editSmallBlind');
    const editBigBlind = document.getElementById('editBigBlind');

    function updateCurrentBlinds() {
        levels[currentLevel].small = Number(editSmallBlind.value) || 0;
        levels[currentLevel].big = Number(editBigBlind.value) || 0;
        levels[currentLevel].ante = Number(editAnte.big) || 0;

        render();
    }

    render();
  </script>
</body>
