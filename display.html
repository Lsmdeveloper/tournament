<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tela do Torneio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(250, 204, 21, 0.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(37, 99, 235, 0.18), transparent 35%),
        #020617;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    #tournamentName{
      font-size: 50px;
    }

    .app {
      width: 100%;
      max-width: 1280px;
      min-height: 82vh;
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.96), rgba(2, 6, 23, 0.96));
      border: 1px solid rgba(250, 204, 21, 0.18);
      border-radius: 36px;
      padding: 48px;
      text-align: center;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.55);
    }

    h1 {
      font-size: clamp(48px, 6vw, 88px);
      color: #facc15;
      margin-bottom: 18px;
      letter-spacing: 1px;
    }

    .status-badge {
      display: inline-block;
      margin-bottom: 18px;
      padding: 12px 28px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 22px;
    }

    .total {
      font-size: 30px;
      color: #cbd5e1;
    }

    .total strong {
      color: #facc15;
    }

    .level-label {
      display: flex;
      color: #93c5fd;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-size: 22px;
      font-weight: 700;
      align-items: center;
      justify-content: center;
    }

    .level-number {
      font-size: clamp(100px, 12vw, 100px);
      color: #facc15;
      font-weight: 900;
      line-height: 0.95;
      text-shadow: 0 0 30px rgba(250, 204, 21, 0.25);
    }

    .timer-title {
      font-size: 56px;
      color: #38bdf8;
      font-weight: 900;
    }

    .timer {
      font-size: clamp(130px, 18vw, 250px);
      font-weight: 900;
      margin: 24px 0 38px;
      line-height: 0.95;
      letter-spacing: 6px;
      text-shadow: 0 0 36px rgba(255, 255, 255, 0.16);
    }

    .blinds {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 26px;
    }

    .blind-box {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.95), rgba(2, 6, 23, 0.95));
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 28px;
      padding: 32px 20px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    }

    .blind-box span {
      color: #93c5fd;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 18px;
      font-weight: 700;
    }

    .blind-box strong {
      display: block;
      margin-top: 14px;
      font-size: clamp(62px, 7vw, 96px);
      color: #fff;
      font-weight: 900;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .extra-info {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-top: 28px;
    }

    .extra-info div {
      background: rgba(0,0,0,0.25);
      border-radius: 20px;
      padding: 18px;
    }

    .extra-info span {
      display: block;
      color: #93c5fd;
      font-size: 16px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .extra-info strong {
      display: block;
      margin-top: 8px;
      font-size: 28px;
      font-weight: 900;
    }
    .payout-display {
      display: none;
      margin-top: 26px;
      padding: 22px;
      border-radius: 24px;
    }

    .payout-title {
      color: #facc15;
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 14px;
    }

    .payout-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    .payout-item {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 16px;
      padding: 14px;
      font-weight: 900;
    }

    .payout-item span {
      display: block;
      color: #93c5fd;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .payout-item strong {
      font-size: 20px;
      color: #fff;
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="header">
      <h1 id="tournamentName">♠ Torneio de Poker</h1>
      <div class="total"> 
        Duração total: <strong id="totalTimer">00:00:00</strong>
      </div>
      <div id="status" class="status-badge">PAUSADO</div>
    </div>
    
    <div class="level-label">Nível <div class="level-number" id="levelNumber">1</div></div>
    <div id="timerTitle" class="timer-title"></div>
    <div class="timer" id="timer">10:00</div>
    <div class="blinds">
      <div class="blind-box">
        <span>Small Blind</span>
        <strong id="smallBlind">25</strong>
      </div>
      <div class="blind-box">
        <span>Big Blind</span>
        <strong id="bigBlind">50</strong>
      </div>
      <div class="blind-box">
        <span>Ante</span>
        <strong id="ante">50</strong>
      </div>
    </div>
    <div class="extra-info">
      <div>
        <span>Próximo nível</span>
        <strong id="nextLevelInfo">-</strong>
      </div>

      <div>
        <span>Jogadores</span>
        <strong id="playersInfo">0</strong>
      </div>

      <div>
        <span>Premiação</span>
        <strong id="prizeInfo">R$ 0,00</strong>
      </div>
    </div>
    <div id="payoutDisplay" class="payout-display"></div>
  </main>

  <script>
    const tournamentName = document.getElementById('tournamentName');
    const levelNumber = document.getElementById('levelNumber');
    const timer = document.getElementById('timer');
    const timerTitle = document.getElementById('timerTitle');
    const smallBlind = document.getElementById('smallBlind');
    const bigBlind = document.getElementById('bigBlind');
    const ante = document.getElementById('ante');
    const totalTimer = document.getElementById('totalTimer');
    const statusEl = document.getElementById('status');

    const nextLevelInfo = document.getElementById('nextLevelInfo');
    const playersInfo = document.getElementById('playersInfo');
    const prizeInfo = document.getElementById('prizeInfo');

    const payoutDisplay = document.getElementById('payoutDisplay');

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60).toString().padStart(2, '0');
      const secs = (seconds % 60).toString().padStart(2, '0');
      return `${minutes}:${secs}`;
    }

    function formatTotalTime(seconds) {
      const hours = Math.floor(seconds / 3600).toString().padStart(2, '0');
      const minutes = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
      const secs = (seconds % 60).toString().padStart(2, '0');
      return `${hours}:${minutes}:${secs}`;
    }

    function updateDisplay() {
      const data = JSON.parse(localStorage.getItem('pokerTournamentState'));
      tournamentName.textContent = `♠ ${data.tournamentName || 'Torneio de Poker'}`;
      if (!data) return;

      const level = data.levels[data.currentLevel];
      statusEl.textContent = data.status;
      if (data.status === 'RODANDO') {
        statusEl.style.background = '#16a34a';
      } else if (data.status === 'PAUSADO') {
        statusEl.style.background = '#dc2626';
      } else if (data.status === 'INTERVALO') {
        statusEl.style.background = '#0ea5e9';
      }
      levelNumber.textContent = data.currentLevel + 1;
      totalTimer.textContent = formatTotalTime(data.totalSeconds);

      smallBlind.textContent = level.small;
      bigBlind.textContent = level.big;
      ante.textContent = level.big;
      const nextLevel = data.levels[data.currentLevel + 1];
      if (nextLevel) {
        nextLevelInfo.textContent = `${nextLevel.small} / ${nextLevel.big}`;
      } else {
        nextLevelInfo.textContent = 'FINAL';
      }

      playersInfo.textContent = `${data.remainingPlayers || 0}/${data.playersCount || 0}`;
      prizeInfo.textContent = data.prizePool || 'R$ 0,00';
      if (data.isBreak) {
        timerTitle.textContent = 'INTERVALO';
        timer.textContent = formatTime(data.breakSeconds);
      } else {
        timerTitle.textContent = '';
        timer.textContent = formatTime(data.remainingSeconds);
      }

      const payouts = JSON.parse(localStorage.getItem('payouts')) || [];

        if (data.showPayouts && payouts.length > 0) {
          payoutDisplay.style.display = 'block';

          payoutDisplay.innerHTML = `
            <div class="payout-title">🏆 Premiação</div>
            <div class="payout-grid">
              ${payouts.slice(0, 5).map(p => `
                <div class="payout-item">
                  <span>${p.position}º lugar</span>
                  <strong>${p.value.toLocaleString('pt-BR', {
                    style: 'currency',
                    currency: 'BRL'
                  })}</strong>
                </div>
              `).join('')}
            </div>
          `;
        } else {
          payoutDisplay.style.display = 'none';
        }
    }

    updateDisplay();
    setInterval(updateDisplay, 500);
  </script>
</body>
</html>
